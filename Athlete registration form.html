<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aspire Athletics Club | Athlete Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>Aspire Athletics Club</h1>
      <p class="slogan">Strive. Sweat. Succeed.</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
         <li><a href="login.html">Login</a></li>
         <li><a href="signup.html">Sign Up</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>
  </header>
  <section class="auth">
    <h2>Athlete Registration</h2>
    <form action="register" method="POST" class="auth-form">
      <label for="full_name">Full Name:</label>
      <input type="text" id="full_name" name="full_name" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" required>

      <label for="category">Category:</label>
      <select id="category" name="category" required>
        <option value="junior">Junior</option>
        <option value="senior">Senior</option>
      </select>

      <label for="sport">Sport:</label>
      <input type="text" id="sport" name="sport" required>

      <label for="training_goals">Training Goals:</label>
      <textarea id="training_goals" name="training_goals"></textarea>

      <label for="emergency_contact">Emergency Contact:</label>
      <input type="text" id="emergency_contact" name="emergency_contact" required>

      <button type="submit" class="cta-button">Register</button>
    </form>
  </section>
</body>
</html>
